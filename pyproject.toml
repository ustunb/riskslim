[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskslim"
version = "0.1.0"
description = "Optimized risk scores on large-scale datasets"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
  { name = "Berk Ustun", email = "berk@ucsd.edu" },
]
dependencies = [
  "numpy>=1.26",
  "scipy",
  "pandas",
  "scikit-learn",
  "plotly",
  "prettytable",
  "cplex>=22.1.2.1",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ustunb/riskslim"
Paper = "https://jmlr.org/papers/v20/18-615.html"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["riskslim*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
riskslim = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
markers = [
  "slow: correctness tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
exclude = ["scripts", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D"]
ignore = ["D104"]
per-file-ignores = { "riskslim/**/*.py" = ["E", "I", "B", "D"], "tests/**/*.py" = ["E", "I", "B", "D"], "examples/**/*.py" = ["D"], "riskslim/__init__.py" = ["F401"], "riskslim/loss_functions/__init__.py" = ["F403"], "riskslim/mip.py" = ["F841"], "tests/test_coefficient_set.py" = ["F841"], "tests/test_fit.py" = ["F841"], "tests/test_warmstart.py" = ["F841"] }

[tool.ruff.lint.pydocstyle]
convention = "google"
