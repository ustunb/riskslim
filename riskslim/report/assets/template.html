<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
{#- Pinned CDN versions: change them here only. #}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css" integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.43/vue.global.prod.min.js" integrity="sha384-jpQley6yTEvoZeHVfCkBVqGK6kLbDxptME8BFcqX9FJiFhpNkdkUSs54xLMnxmuB" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@4.1.1/plotly-basic.min.js" integrity="sha384-N2HZsG+IG/3J8CwhGGYz/kmzZ0sprpPWwjhor9ZI4lxuf47i9DXK2/NDGxMaJiEb" crossorigin="anonymous"></script>
<style>
{{ styles }}
</style>
</head>
<body>
{#- The page structure: a 2x2 grid of cards, each with one component slot that mount_report.js
    fills. A slot is display:contents, so the component renders as a direct child of its card. #}
<main class="container" id="report">
<header class="rs-head"><h2>{{ title }}</h2></header>
<section class="rs-row">
<article class="rs-card">
<header><h3>Model</h3></header>
<div class="rs-slot" data-component="model-card"></div>
</article>
<article class="rs-card">
<header><h3>Summary</h3></header>
<div class="rs-slot" data-component="summary-table"></div>
</article>
</section>
<section class="rs-row">
<article class="rs-card">
<header><h3>ROC</h3></header>
<div class="rs-slot" data-component="plotly-chart" data-figure="roc"></div>
</article>
<article class="rs-card">
<header><h3>Calibration</h3></header>
<div class="rs-slot" data-component="plotly-chart" data-figure="calibration"></div>
</article>
</section>
</main>
<script type="application/json" id="report-data">{{ data }}</script>
<script>
{{ scripts }}
</script>
</body>
</html>
