# CI = lint + tests + the install check (SPEC.md § Install check).
# The install check exercises the BUILT ARTIFACT, never the source tree: pytest runs
# with --import-mode=importlib from a neutral working directory (runner.temp), so
# `import riskslim` resolves to the installed wheel or sdist.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uvx ruff check riskslim tests
      - run: >-
          uvx ruff format --check examples/quickstart.py tests/conftest.py
          tests/generate_training_test_cases.py tests/test_training.py
          tests/test_training_known.py tests/test_solver.py

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - name: Check CPLEX
        run: uv run pytest --noconftest tests/test_solver.py -q -s
      - name: Diagnose intermittent planted-model regression
        timeout-minutes: 3
        run: |
          uv run python - <<'PY'
          import json
          import sys
          import time
          import numpy as np

          sys.path.insert(0, "tests")
          from utils import generate_random_normal
          from riskslim import RiskSLIMClassifier

          data, rho_true = generate_random_normal(200, 12, 4, 4)
          X = data["X"]
          y = np.ravel(data["y"])
          rho_planted = np.insert(rho_true, 0, 0)
          planted_scores = y * (rho_planted[0] + X @ rho_planted[1:])
          planted_objective = float(np.mean(np.logaddexp(0.0, -planted_scores)) + 4e-6)
          configurations = {
              "historical": {"cplex_integrality_tolerance": np.finfo(float).eps,
                             "cplex_optimality_tolerance": 1e-6},
              "integrality-fix-only": {"cplex_integrality_tolerance": 1e-6,
                                       "cplex_optimality_tolerance": 1e-6},
              "current": {},
          }
          violations = {name: [] for name in configurations}
          for config_name, settings in configurations.items():
              for repeat in range(8):
                  started = time.perf_counter()
                  classifier = RiskSLIMClassifier(
                      max_coef=5,
                      max_size=4,
                      c0_value=1e-6,
                      variable_names=data["variable_names"],
                      outcome_name=data["outcome_name"],
                      verbose=False,
                      max_runtime=60,
                      **settings,
                  ).fit(X, y)
                  wall_time = time.perf_counter() - started
                  optimizer = classifier.optimizer
                  solution = optimizer.solution
                  rho = np.r_[classifier.intercept_, classifier.coef_]
                  scores = y * (rho[0] + X @ rho[1:])
                  logistic_loss = float(np.mean(np.logaddexp(0.0, -scores)))
                  recomputed_objective = float(logistic_loss + 1e-6 * np.count_nonzero(rho[1:]))
                  violated = not bool(recomputed_objective <= planted_objective + 1e-6)
                  if violated:
                      violations[config_name].append(repeat)
                  print(json.dumps({
                      "config": config_name,
                      "repeat": repeat,
                      "rho": rho.tolist(),
                      "raw_objective": solution.get_objective_value(),
                      "recomputed_objective": recomputed_objective,
                      "planted_objective": planted_objective,
                      "status": solution.get_status_string(),
                      "wall_time": wall_time,
                      "violates_planted_bound": violated,
                  }, separators=(",", ":")))
          print(json.dumps({"violation_repeats": violations}, separators=(",", ":")))
          assert not violations["current"], violations
          PY
      # full suite on pushes; default suite on PRs
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run pytest
          else
            uv run pytest -m ""
          fi

  install-check:
    name: install check (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build artifacts
        run: uv build

      - name: Check metadata and contents
        run: |
          uvx twine check dist/*
          uvx check-wheel-contents dist/*.whl
          uvx check-manifest

      - name: Forbidden paths must not ship
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile, sys
          FORBIDDEN = ("scripts/", "data/", "notebooks/", "reports/", ".claude/", ".github/")
          whl = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = zipfile.ZipFile(whl).namelist()
          names += [n.split("/", 1)[1] for n in tarfile.open(sdist).getnames() if "/" in n]
          bad = [n for n in names for f in FORBIDDEN if n.startswith(f) or f"/{f}" in n]
          if bad:
              sys.exit(f"forbidden paths in artifacts: {sorted(set(bad))[:20]}")
          print("artifacts clean")
          PY

      - name: Wheel - quickstart + tests
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project \
            --with "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" --with pytest \
            python "$GITHUB_WORKSPACE/examples/quickstart.py"
          uv run --isolated --no-project \
            --with "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" --with pytest \
            python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -m "not slow"

      - name: Sdist - quickstart + tests
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project \
            --with "$(ls "$GITHUB_WORKSPACE"/dist/*.tar.gz)" --with pytest \
            python "$GITHUB_WORKSPACE/examples/quickstart.py"
          uv run --isolated --no-project \
            --with "$(ls "$GITHUB_WORKSPACE"/dist/*.tar.gz)" --with pytest \
            python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -m "not slow"
